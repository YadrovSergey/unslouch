name: Site

# Builds the static website (site/) and uploads it to a Selectel S3 bucket behind the Selectel CDN.
# Secrets live only in GitHub Actions Secrets: SELECTEL_S3_ACCESS_KEY, SELECTEL_S3_SECRET_KEY, SELECTEL_S3_BUCKET.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "CHANGELOG.ru.md"
      - "legal/**"
      - "src/exercises/**"
      - "src/lib/**"
      - "src/locales/**"
      - "src/sound.ts"
      - "src/styles.css"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The site imports the exercise catalog and figures from ../src; React is deduped to site/node_modules,
      # so the app's own dependencies are not needed here.
      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      # Until the Selectel bucket and its keys are set up, only check that the site builds.
      - name: Is Selectel configured?
        id: selectel
        env:
          BUCKET: ${{ secrets.SELECTEL_S3_BUCKET }}
        run: |
          if [ -n "$BUCKET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Selectel is not set up yet (no SELECTEL_S3_* secrets): the site was built, upload skipped."
          fi

      - name: Upload to Selectel S3
        if: steps.selectel.outputs.ready == 'true'
        working-directory: site/dist
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SELECTEL_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SELECTEL_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-1
          BUCKET: ${{ secrets.SELECTEL_S3_BUCKET }}
          # Selectel S3 does not accept the new default checksums of AWS CLI 2.23+.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          # AWS CLI ships its own CA list without GlobalSign Root R6, which signs Selectel's certificate.
          AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          ENDPOINT: https://s3.ru-1.storage.selcloud.ru
        run: |
          set -euo pipefail
          # Hashed assets never change: cache for a year.
          aws s3 sync _astro "s3://$BUCKET/_astro" --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          # Icons and images: a day.
          aws s3 sync . "s3://$BUCKET" --endpoint-url "$ENDPOINT" \
            --exclude "*" --include "*.png" --include "*.ico" --include "*.svg" --include "*.webp" \
            --exclude "_astro/*" \
            --cache-control "public, max-age=86400"
          # HTML, sitemap, robots: always revalidate so a deploy shows up at once.
          aws s3 sync . "s3://$BUCKET" --endpoint-url "$ENDPOINT" \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" \
            --cache-control "no-cache"
          # Remove files that are no longer in the build (last, so pages never point to missing assets).
          # releases/ holds installers and latest.json from cdn.yml: never delete them from here.
          # _astro/ is kept too: its file names are hashed, and a page the CDN still has cached from an older deploy
          # refers to the old CSS and JS. Deleting them left such a page without styles.
          aws s3 sync . "s3://$BUCKET" --endpoint-url "$ENDPOINT" --delete --size-only \
            --exclude "releases/*" --exclude "_astro/*" \
            --cache-control "no-cache"
