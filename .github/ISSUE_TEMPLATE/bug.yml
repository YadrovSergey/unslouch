name: Bug report / Ошибка
description: Something does not work as expected / Что-то работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not post it here, email support@health-diet.ru.
        Уязвимость? Не пишите сюда, пришлите на support@health-diet.ru.
  - type: textarea
    id: what
    attributes:
      label: What happened / Что случилось
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить
      placeholder: |
        1. Open settings
        2. ...
  - type: input
    id: version
    attributes:
      label: App version / Версия приложения
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS / Система
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version / Версия системы
      placeholder: "macOS 15.2, Windows 11 24H2, Ubuntu 24.04 (GNOME, Wayland)"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, anything else / Скриншоты, что-то ещё
