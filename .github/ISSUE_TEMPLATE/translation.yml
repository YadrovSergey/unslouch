name: Translation / Перевод
description: A mistake or awkward wording in a translation / Ошибка или неудачная фраза в переводе
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        You can also fix it directly in `src/locales/<code>.json` and open a pull request.
        Можно сразу поправить `src/locales/<код>.json` и прислать pull request.
  - type: input
    id: language
    attributes:
      label: Language / Язык
      placeholder: "de, pt-BR, uk..."
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text and where it appears / Текущий текст и где он
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text / Как лучше
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why (optional) / Почему (необязательно)
